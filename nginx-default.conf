# RumiCar Simulator 静的配信 nginx 設定（gzip 圧縮を有効化）。
# edge(infra-nginx) はこの圧縮済みレスポンスをそのまま中継する（二重圧縮しない）。
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # --- gzip 圧縮（起動読み込みの最大の高速化要因）---
    # JS/CSS/JSON/SVG を圧縮。HTML も含む。バイナリ(画像)は対象外。
    gzip            on;
    gzip_comp_level 6;          # 6 = 圧縮率と CPU の実用的バランス
    gzip_min_length 1024;       # 1KB 未満は圧縮しても無駄なので素通し
    gzip_vary       on;         # Vary: Accept-Encoding（プロキシ/CDN 整合）
    gzip_proxied    any;        # プロキシ経由(infra-nginx)でも圧縮を返す
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # --- キャッシュ制御（毎回再検証させる）---
    # 配信物は index.html 1・css 1・data/courses.json 1・js 46 の計 49 ファイル。ビルド工程が
    # 無く public/ をそのまま配るので、**版番を持つのは style.css だけ**（index.html が
    # `css/style.css?v=…` で読む）。残る js 46 本と courses.json はファイル名に版を持たない。
    # Cache-Control が無いとブラウザはヒューリスティック鮮度（Date − Last-Modified の約 10%）を
    # 使うため、長く変わっていないモジュールほど古い版が長く残る。ES モジュールは名前付き
    # import で互いを参照するので、新しい側が「改修前に無かった名前」を import した瞬間、
    # 古い相手と組み合わさって does not provide an export named でアプリ全体が起動しない。
    #
    # そこで鮮度を一切与えず（= no-cache）、毎回 ETag / Last-Modified で再検証させる:
    #  ・no-cache は「保存はするが、使う前に必ず再検証」の意味（no-store ではない）。
    #    再検証は変わっていなければ 304 で終わり、本体は転送されない（curl・実ブラウザとも実測）。
    #  ・**短い正の max-age（60s 等）にしてはならない**。鮮度が切れたファイルと切れていない
    #    ファイルが混ざる瞬間が生まれ、それが上の起動不能そのものだから。窓を狭めるだけで塞がない。
    #  ・compose.yaml の前提「public/ を編集 → 再読込で即反映・再ビルド不要」も、鮮度 0 でのみ保たれる。
    #    （付ける前はヒューリスティック鮮度が効いていたので、この前提は実は保証されていなかった。）
    #
    # 正直に書いておく限界（2026-09-16 BC1 の実測で分かったこと）:
    #  ・**再訪あたりの要求本数は増える**。付ける前は鮮度が生きている間ネットワークに出なかったが、
    #    付けた後は毎回再検証が出る。実測（実ブラウザ・自オリジンへの応答を数えた）では
    #    1 回の再読込あたり 49 本で、キャッシュが温まっていた回は 46 本が 304（本体転送なし）。
    #    増えるのは要求の往復であって本体の転送量ではない。払う価値のあるコストと判断した。
    #  ・**既にキャッシュ済みのブラウザには今すぐ届かない**。鮮度が切れるまで要求自体が出ないので、
    #    BA1 と同型の事故は移行期間中はまだ起こりうる。急ぐなら style.css と同じクエリ版番を
    #    js にも当てる手があるが、本ブロックでは猶予を待つ判断を採った。
    #
    # server 直下に置く理由: location で add_header を書くと **その location では server 直下の
    # add_header が一切継承されない**（nginx の add_header は「最も内側で定義された階層だけ」が有効）。
    # 将来 location に add_header を足すときは、ここの 1 行も併せて書くこと。
    # `expires` を足した場合は上書きされず **Cache-Control が 2 本出る**（結合され no-cache が勝つが
    # 意図の読めない応答になる）。`always` は 404 等にも乗せるために付けている（304 は無くても乗る）。
    add_header Cache-Control "no-cache" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
