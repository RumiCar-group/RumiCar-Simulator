# RumiCar Simulator — 既存 nginx へ差し込む location スニペット (統合構成)。
#
# 本番 rumicar.com はこの形で WordPress と同一 nginx の server{} 内に同居している。
# 既存サイトへ後付けする場合は、この2つの location を対象 server{} の中へ貼るだけでよい。
# (http{} コンテキストの命令は含まないので、他の conf との duplicate は起きない。)
#
# 前提:
#  1. simulator コンテナが同じ docker ネットワークに参加し、名前 `simulator` で解決できること。
#     本番では webstack の nginx が外部ネットワーク rumicar-net に参加して到達している。
#     compose 側の記述例:
#         networks:
#           - web            # 既存サイト用
#           - rumicar-net    # simulator へ到達するため (external: true)
#  2. simulator 側の compose は service 名を `simulator` にしておくこと
#     (Simulator/compose.yaml は既にそうなっている)。
#
# HTTPS で配信する場合も内容は同一。本番では 80 用と 443 用の server{} 双方に
# 同じ内容を置いて挙動を揃えている (本番構成の時点記録は docs/archive/deploy_reference_2026-07-30/ を参照)。

location = /simulator { return 301 /simulator/; }

location ^~ /simulator/ {
    # docker DNS。コンテナ再作成でIPが変わっても追従する。
    # proxy_pass に変数を使うことで「起動時に1度だけ解決」される罠を回避する。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rumicar_sim simulator;

    # プレフィックス除去 (コンテナは / 配信)。
    rewrite ^/simulator/(.*)$ /$1 break;

    # HTTP/1.1 で接続する。simulator 側の gzip_http_version 1.1 を満たし gzip 配信を維持するため。
    proxy_http_version 1.1;
    proxy_pass http://$rumicar_sim:80;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 注意 (本番で実際に踏んだ点):
#  ・`^~` は必須。付けないと、WordPress 用の静的ファイル regex location
#    (\.(js|css|json)$ 等) が /simulator/js/... を先に捕まえてしまい 404 になる。
#  ・WordPress のページキャッシュ (fastcgi_cache) を使っている場合、
#    /simulator/ は proxy_pass 経路なので影響を受けない。
#  ・既存 nginx が `wordpress:9000` のように **静的名** で fastcgi_pass している場合、
#    その解決は起動時に固定される。simulator ではなく WordPress 側コンテナを
#    再作成したときは nginx も restart が必要になる (別件だが同じ罠)。
