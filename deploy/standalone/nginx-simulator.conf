# RumiCar Simulator — スタンドアロン配信用リバースプロキシ。
#
# 本番 (rumicar.com) は WordPress と同一の nginx が /simulator/ を配信している。
# 新規サーバーで「シミュレータだけ」を立てる場合、WordPress は不要だが
# **URL のプレフィックスは本番と揃えておく**必要がある:
#   アプリ内の共有 URL・GitHub Issue へのリンク・相対パス解決が /simulator/ 配下を前提に
#   組まれているため、ルート直下 (/) で配信すると共有 URL の互換性が崩れる。
# そのため本ファイルは本番と同じ /simulator/ プレフィックスを再現する。
#
# 本番の該当設定は deploy/integrated/ に参照用として同梱している。

server {
    listen 80;
    server_name _;
    server_tokens off;                              # nginx バージョン秘匿

    # 相対 Location を返す。これが無いと `return 301 /simulator/` が
    # 「$host + コンテナの listen ポート(80)」で絶対URLを組むため、
    # SIM_PORT=8090 のような非標準ポートで公開したときにポートが落ちて
    # http://host/simulator/ へ飛んでしまう (実測して見つけた)。
    # リバースプロキシ配下でも正しく振る舞うので常に off が安全。
    absolute_redirect off;

    # gzip (simulator コンテナ側でも有効だが、プロキシ経由の再圧縮を避けるため
    # ここでは有効化しない。simulator の gzip 済みレスポンスをそのまま通す。)

    # 素のルートアクセスは /simulator/ へ誘導する (単体運用時の利便)。
    location = / { return 301 /simulator/; }

    # 末尾スラッシュ無しを正規化 (本番と同挙動)。
    location = /simulator { return 301 /simulator/; }

    # ---- 本体プロキシ ----
    # ^~ を付けて、下位の静的 regex location にサブパス (/simulator/js/... 等) を
    # 奪われないことを保証する (本番 default.conf と同じ理由)。
    location ^~ /simulator/ {
        resolver 127.0.0.11 valid=10s ipv6=off;     # docker DNS。コンテナ再作成でIPが変わっても追従する
        set $rumicar_sim simulator;                 # 変数経由にすることで起動時解決に固定されない
        rewrite ^/simulator/(.*)$ /$1 break;        # プレフィックス除去 (コンテナは / 配信)
        proxy_http_version 1.1;                     # simulator 側 gzip_http_version 1.1 を満たし gzip 配信を維持
        proxy_pass http://$rumicar_sim:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 死活確認用。nginx が直接返すため simulator の状態に巻き込まれない。
    location = /healthz { access_log off; return 200 "ok\n"; }
}
